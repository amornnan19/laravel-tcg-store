name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]

    services:
      # Started on both legs (a service cannot be conditional); only the pgsql leg points the tests at it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, exif, gd, intl, pdo_pgsql, pdo_sqlite, sqlite3, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Pint
        if: matrix.db == 'sqlite'
        run: vendor/bin/pint --test --format agent

      # phpunit.xml sets the sqlite values with <env>, which PHPUnit applies only when the variable is not already set.
      # So the pgsql leg overrides them from the environment, and the sqlite leg sets nothing and keeps :memory:.
      - name: Point the tests at Postgres
        if: matrix.db == 'pgsql'
        run: |
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=testing"
            echo "DB_USERNAME=postgres"
            echo "DB_PASSWORD=postgres"
          } >> "$GITHUB_ENV"

      - name: Tests
        run: php artisan test --compact

  # Deploys main to Coolify once every test leg has passed. Runs only on a push to main in this repository, never on
  # a pull request or a fork. Needs three repository secrets: COOLIFY_URL (https://<coolify host>), COOLIFY_TOKEN
  # (an API token with the deploy ability only) and COOLIFY_APP_UUID. Without them the job says so and does nothing.
  deploy:
    name: deploy to coolify
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'amornnan19/laravel-tcg-store'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Ask Coolify to deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "::warning::COOLIFY_URL, COOLIFY_TOKEN or COOLIFY_APP_UUID is not set; skipping the deploy."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json"
