; Loaded after php.ini-production.

expose_php = Off

; Payment slips are limited to 5 MB (shop.slip_max_kb) and variant photos are
; of the same order, so the app's own validation is the limit people meet, not
; PHP's 2 MB default. post_max_size covers a few photos in one request.
upload_max_filesize = 8M
post_max_size = 12M

; GD decodes an uploaded photo into a raw bitmap before re-encoding it.
memory_limit = 256M

; The code never changes inside a running container.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
